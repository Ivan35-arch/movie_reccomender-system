<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Seive — Movie Recommendations</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="brand">
        <h1>Seive</h1>
        <p class="tag">Personalized movie recommendations</p>
      </div>
      <div class="controls">
        <input id="search" placeholder="Search movies, e.g. Toy Story" />
        <button id="btn-search">Search</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="movies-grid" id="movies">
      <!-- Movie cards rendered here -->
    </section>

    <aside class="sidebar">
      <div class="card">
        <h3>Your Recommendations</h3>
        <ul id="recommendations" class="rec-list">
          <li class="muted">No recommendations yet — rate a movie to get started.</li>
        </ul>
      </div>

      <div class="card small">
        <h4>Live Updates</h4>
        <div id="events" class="events">
          <div class="muted">SSE status: <span id="sse-status">disconnected</span></div>
        </div>
      </div>
    </aside>
  </main>

  <template id="movie-card-tpl">
    <article class="movie-card">
      <img class="poster" alt="poster" src="" />
      <div class="meta">
        <h4 class="title"></h4>
        <div class="year-rating">
          <span class="year muted"></span>
          <div class="stars" data-rated="0">
            <button class="star" data-value="1">★</button>
            <button class="star" data-value="2">★</button>
            <button class="star" data-value="3">★</button>
            <button class="star" data-value="4">★</button>
            <button class="star" data-value="5">★</button>
          </div>
        </div>
        <p class="overview muted small"></p>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
