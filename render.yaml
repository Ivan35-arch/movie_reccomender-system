# Render service manifest for the Flask ML service
# Usage: connect repo in Render, Render will read this manifest on deploy

services:
  - type: web
    name: flask-ml
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r flask-ml/requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        value: ""
        hidden: true
      - key: MODEL_PATH
        value: "/opt/render/project/src/flask-ml/model/movie_recommender_model.joblib"
        hidden: false
      - key: TMDB_API_KEY
        value: ""
        hidden: true
      - key: SECRET_KEY
        value: ""
        hidden: true
